# Create the Slack app from this manifest: api.slack.com/apps -> Create New App -> From a manifest.
# Then: Basic Information -> App-Level Token (scope connections:write) = SLACK_APP_TOKEN,
#       Install to Workspace -> Bot User OAuth Token = SLACK_BOT_TOKEN.
display_information:
  name: Lane
  description: Your growth and marketing teammate.
features:
  bot_user:
    display_name: Lane
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
